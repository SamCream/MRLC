name: backend-infra

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-infra.yml"
  push:
    branches:
      - "feat/backend-infra-migration"
    paths:
      - "backend/**"
      - ".github/workflows/backend-infra.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MRLC_ADMIN_PASSWORD: test-password-very-long
      MRLC_ADMIN_TOKEN: test-admin-token-very-long-and-independent-12345
      MRLC_SESSION_SECRET: test-signing-key-longer-than-thirty-two-chars-12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app infra runtime gateway adapters
      - run: python -m pytest -q tests
